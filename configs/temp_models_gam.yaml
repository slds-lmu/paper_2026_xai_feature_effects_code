GAM_OF:
  model: GAM
  model_params:
    SimpleNormalCorrelated:
      1250:
        n_bases: 50
        lam: 0.0005
      10000:
        n_bases: 64
        lam: 0.00001
    Friedman1:
      1250:
        n_bases: 50
        lam: 0.0001
      10000:
        n_bases: 80
        lam: 0.00000001
    FeynmanI.29.16:
      1250:
        n_bases: 50
        lam: 0.0001
      10000:
        n_bases: 64
        lam: 0.0000005

